name: Build Android bundle
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python3 build.py
      - run: npm install
      - run: npx cap add android
      - run: npm install --no-save @capacitor/assets && npx capacitor-assets generate --android --iconBackgroundColor '#18648e' --splashBackgroundColor '#0b3b63'
      - name: Target Android 16 (API 36), portrait only, version
        run: |
          sed -i -E 's/(compileSdkVersion *= *)[0-9]+/\136/; s/(targetSdkVersion *= *)[0-9]+/\136/' android/variables.gradle
          cat android/variables.gradle
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' android/app/src/main/AndroidManifest.xml
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - run: npx cap sync android
      - name: Create upload key (first run) or reuse secrets
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > upload.jks; PASS="$KS_PASS"
          else PASS="$(openssl rand -hex 12)"; keytool -genkeypair -v -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Tidebound, O=Tidebound, C=ES"; echo "$PASS" > keystore-password.txt; fi
          echo "KS_PATH=$PWD/upload.jks" >> $GITHUB_ENV; echo "KS_PASSWORD=$PASS" >> $GITHUB_ENV
      - name: Sign release in gradle
        run: |
          cat >> android/app/build.gradle <<GRADLE
          android {
            signingConfigs { release { storeFile file("$KS_PATH"); storePassword "$KS_PASSWORD"; keyAlias "upload"; keyPassword "$KS_PASSWORD" } }
            buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE
      - run: cd android && chmod +x gradlew && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tidebound-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            upload.jks
            keystore-password.txt
