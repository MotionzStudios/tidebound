name: Build iOS and upload to TestFlight
on:
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode (Apple requires Xcode 26+)
        run: |
          ls /Applications | grep -i xcode
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python3 build.py
      - run: npm install
      - run: npm install @capacitor/ios@latest
      - run: npx cap add ios
      - run: npm install --no-save @capacitor/assets && npx capacitor-assets generate --ios --iconBackgroundColor '#18648e' --splashBackgroundColor '#0b3b63'
      - run: npx cap sync ios
      - name: Portrait only, version numbers, encryption flag
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $P || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $P
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $P || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $P || true
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/; s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = 1.1.0;/" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/' ios/App/App.xcodeproj/project.pbxproj
      - name: Clean IDs (first word only)
        env:
          T: ${{ secrets.APPLE_TEAM_ID }}
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "TEAM=$(echo "$T" | awk '{print $1}')" >> $GITHUB_ENV
          echo "KEYID=$(echo "$K" | awk '{print $1}')" >> $GITHUB_ENV
          echo "ISSUER=$(echo "$I" | awk '{print $1}')" >> $GITHUB_ENV
      - name: AdMob and tracking keys (iOS Info.plist)
        run: |
          P=ios/App/App/Info.plist
          AID=$(python3 -c "import json;print(json.load(open('monetization.json'))['admob']['ios']['appId'])")
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $AID" $P || /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $AID" $P
          /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string This lets us show ads that are more relevant to you. You can say no and still play." $P || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems array" $P || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0 dict" $P || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string cstr6suwn9.skadnetwork" $P || true
          cat $P
      - name: Write App Store Connect API key
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$KEY" > ~/private_keys/AuthKey_$KEYID.p8
      - name: Archive (unsigned; export step signs for the App Store)
        run: |
          cd ios/App
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=$TEAM CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Strip vendor signatures from embedded frameworks (so export re-signs them)
        run: |
          APP=$(find $RUNNER_TEMP/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          for F in "$APP"/Frameworks/*.framework; do
            [ -d "$F" ] || continue
            echo "Unsigning $F"
            codesign --remove-signature "$F" || true
            codesign -dv "$F" 2>&1 | head -3 || true
          done
      - name: Export and upload to TestFlight
        run: |
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEYID.p8 \
            -authenticationKeyID $KEYID \
            -authenticationKeyIssuerID $ISSUER
