name: Build Android bundle
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python3 build.py
      - run: npm install
      - run: npx cap add android
      - run: npm install --no-save @capacitor/assets && npx capacitor-assets generate --android --iconBackgroundColor '#18648e' --splashBackgroundColor '#0b3b63'
      - name: Target Android 16 (API 36), portrait only, version
        run: |
          sed -i -E 's/(compileSdkVersion *= *)[0-9]+/\136/; s/(targetSdkVersion *= *)[0-9]+/\136/' android/variables.gradle
          cat android/variables.gradle
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' android/app/src/main/AndroidManifest.xml
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - run: npx cap sync android
      - name: Keep game inside system bars (native insets passed to the game)
        run: |
          mkdir -p android/app/src/main/java/com/tidebound/fishing
          cat > android/app/src/main/java/com/tidebound/fishing/MainActivity.java <<'JAVA'
          package com.tidebound.fishing;

          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.webkit.WebView;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private int top = 0, bottom = 0;
            private final Handler h = new Handler(Looper.getMainLooper());

            private void push() {
              try {
                WebView w = getBridge().getWebView();
                float d = getResources().getDisplayMetrics().density;
                String js = "document.documentElement.style.setProperty('--sat','" + Math.round(top / d) + "px');"
                    + "document.documentElement.style.setProperty('--sab','" + Math.round(bottom / d) + "px');";
                w.evaluateJavascript(js, null);
              } catch (Exception e) { }
            }

            private void onInsets(WindowInsetsCompat insets) {
              Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
              top = bars.top; bottom = bars.bottom;
              push();
              int[] delays = new int[]{300, 1000, 2500, 5000};
              for (int ms : delays) h.postDelayed(new Runnable() { public void run() { push(); } }, ms);
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().getDecorView().setBackgroundColor(0xFF0B3B63);
              View decor = getWindow().getDecorView();
              View content = findViewById(android.R.id.content);
              ViewCompat.setOnApplyWindowInsetsListener(decor, (v, insets) -> { onInsets(insets); return insets; });
              if (content != null) ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> { onInsets(insets); return insets; });
              ViewCompat.requestApplyInsets(decor);
            }

            @Override
            public void onResume() { super.onResume(); push(); }
          }
          JAVA
      - name: AdMob app ID (Android manifest)
        run: |
          python3 - <<'PY'
          import json, re
          aid = json.load(open('monetization.json'))['admob']['android']['appId']
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s = re.sub(r'(<application\b[^>]*>)', r'\1\n<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="%s"/>' % aid, s, count=1)
          open(p, 'w').write(s)
          print(s)
          PY
      - name: Create upload key (first run) or reuse secrets
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > upload.jks; PASS="$KS_PASS"
          else PASS="$(openssl rand -hex 12)"; keytool -genkeypair -v -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Tidebound, O=Tidebound, C=ES"; echo "$PASS" > keystore-password.txt; fi
          echo "KS_PATH=$PWD/upload.jks" >> $GITHUB_ENV; echo "KS_PASSWORD=$PASS" >> $GITHUB_ENV
      - name: Sign release in gradle
        run: |
          cat >> android/app/build.gradle <<GRADLE
          android {
            signingConfigs { release { storeFile file("$KS_PATH"); storePassword "$KS_PASSWORD"; keyAlias "upload"; keyPassword "$KS_PASSWORD" } }
            buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE
      - run: cd android && chmod +x gradlew && ./gradlew bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tidebound-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            upload.jks
            keystore-password.txt
