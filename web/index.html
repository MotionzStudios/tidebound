  :root {
    --sky-top: #9fd8f0;
    --sky-bot: #e8f6f2;
    --water-top: #2b8fb8;
    --water-bot: #0b3b63;
    --ink: #0e2a3f;

    --good: #06d6a0;
    --warn: #ffd166;
    --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: light;

  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; margin: 0; }
  #sbT, #sbB { position: fixed; left: 0; right: 0; background: #0b3b63; }
  #sbT { top: 0; height: var(--sat); }
  #sbB { bottom: 0; height: var(--sab); }
  body { background: var(--water-bot); color: var(--ink); overflow: hidden; overscroll-behavior: none; }
  #c { display: block; position: fixed; left: 0; top: var(--sat); width: 100%; height: calc(100% - var(--sat) - var(--sab)); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
</style>

function shopTap(kind, i) {

const IDLE = 0, WAIT = 1, BITE = 2, REEL = 3, RESULT = 4;

let msg = "Tap the water to cast", result = null, newBest = false, shake = 0;

function press() {

    else { state = IDLE; msg = "Too early. Tap to cast"; }
  }

    msg = "Hold to reel. Let go when the line turns red.";

}
function release() { holding = false; }

function updateReel(dt) {
  const boss = BOSS[fish.name]; let tMul = 1, pMul = 1, relMul = 1;
  burstT -= dt;
  if (boss) {
    bossT += dt;
    const bi = bossInfo();
    if (bi.idx !== bossPh) {
      if (bossPrev === "roar") progress = Math.max(0, progress - 0.05);   // the Old King catches his breath
      if (bi.type === "leap" || bossPrev === "leap") splashAt(reelPos().x, reelPos().y, 12);
      bossPrev = bi.type; bossPh = bi.idx; burstT = 0; shake = Math.max(shake, 0.18); SFX.boss(); msg = PHASE[bi.type].hint;
    }
    if (bi.left < 1 && (bi.next === "leap" || bi.next === "roar") && bossWarn !== bi.idx) { bossWarn = bi.idx; SFX.bite(); }
    if (burstT <= 0) {
      if (bi.type === "run") { pull = Math.random() < 0.5 ? fish.str * 1.5 : fish.str * 0.1; burstT = rand(0.4, 0.8); }
      else if (bi.type === "dive") { pull = fish.str * 1.15; burstT = 9; }
      else if (bi.type === "thrash") { pull = fish.str * rand(0, 1.6); burstT = rand(0.15, 0.35); }
      else if (bi.type === "murk") { pull = fish.str * 0.9; burstT = 9; }
      else if (bi.type === "surge") { pull = fish.str * (1.2 + 1.5 * Math.sin(bossT * 3.2)); burstT = 0.05; }
      else if (bi.type === "flash") { pull = fish.str * rand(0, 1.8); burstT = rand(0.1, 0.3); }
      else if (bi.type === "freeze") { pull = fish.str * 0.9; burstT = 9; }
      else if (bi.type === "leap") { pull = 0; burstT = 9; }
      else if (bi.type === "roar") { pull = fish.str * 2.4; burstT = 9; }
      else { pull = fish.str * 0.08; burstT = 9; }
    }
    if (bi.type === "dive") { tMul = 1.2; pMul = 0.85; } else if (bi.type === "tire") { tMul = 0.7; pMul = 1.8; }
    else if (bi.type === "murk") { pMul = 0.9; } else if (bi.type === "surge") { pMul = 0.9; } else if (bi.type === "flash") { tMul = 1.3; } else if (bi.type === "freeze") { tMul = 1.1; relMul = 0.5; } else if (bi.type === "leap") { tMul = 3.5; pMul = 0; } else if (bi.type === "roar") { tMul = 1.5; pMul = 0; }

  }
  else if (burstT <= 0) {
    if (fish.style === "diver") { pull = fish.str * rand(0.6, 1.0); burstT = rand(0.8, 1.4); }
    else if (fish.style === "sprinter") { pull = Math.random() < 0.45 ? fish.str * 1.6 : fish.str * 0.1; burstT = rand(0.4, 0.9); }
    else { pull = fish.str * rand(0, 1.5); burstT = rand(0.2, 0.5); }
  }
  if (holding) { tension += (0.30 + pull * 0.7) * GEAR.line[eq.line].ten * (1 - 0.03 * sk("hands")) * (1 - 0.02 * sk("tough")) * (bf("leader") ? 0.85 : 1) * tMul * dt; progress += 0.22 * GEAR.rod[eq.rod].reel * (1 + 0.04 * sk("reel")) * (1 + 0.03 * sk("hook")) * pMul * dt; }

  tension = clamp(tension, 0, 1); progress = clamp(progress, 0, 1);
  if (tension >= 1 && sk("chance") && !usedChance) { usedChance = true; tension = 0.75; shake = 0.3; say("Second Chance! Line saved"); SFX.bite(); }
  else if (tension >= 1 && guards > 0 && !guardUsed) { guardUsed = true; guards--; tension = 0.75; shake = 0.3; say("Line Guard saved the line!"); SFX.bite(); save(); }
  else if (tension >= 1) {
    state = RESULT; holding = false;
    stats.snaps++;
    result = {ok: false, title: "Line snapped!", sub: fish.duel ? fish.duel.name + " wins this round." : "The " + fish.name + " got away."};
    msg = "Tap to try again"; shake = 0.4; SFX.snap(); splashAt(reelPos().x, reelPos().y, 14);
  } else if (progress >= 1 && fish.duel) { finishDuel(); }
  else if (progress >= 1) {
    const gain = fish.find ? (fish.kind === "pouch" ? Math.round(fish.coins * Math.pow(1.15, mapIdx)) : fish.coins) : Math.round(weight * fish.value * (1 + 0.04 * sk("haggle")) * coinMul() * (fish.rarity === "Legendary" ? 1 + 0.1 * sk("hunter") : 1) * (shiny ? 3 : 1) * (fish.name === fotd().name ? 2 : 1));
    let pageGot = -1;
    if (fish.find) coins += gain;
    holding = false;
    if (!fish.find) { if (shiny) stats.shiny++; stats.catches++; stats.earned += gain; stats.big = Math.max(stats.big, weight); }
    newBest = !fish.find && weight > (best[fish.name] || 0);
    if (newBest) best[fish.name] = weight;
    const gxp0 = fish.find ? 6 : Math.round(weight * fish.value * 0.3) + {Common: 5, Uncommon: 12, Rare: 30, Legendary: 100, Event: 60}[fish.rarity] + (newBest ? 5 : 0), gxp = Math.round(gxp0 * (1 + 0.05 * sk("scholar")) * (bf("lamp") ? 2 : 1) * (1 + petV("xp")));

    const mt = fish.find ? "" : dropMats(fish);
    let ot = 0;
    if (!fish.find) { wkAdd("catch", 1); wkAdd("earn", gain); if (RANK[fish.rarity] >= 1) wkAdd("rare", 1); if (weight >= 20) wkAdd("big", 1); wkAdd("map" + mapIdx, 1); storyBump(fish); if (petV("otter") && Math.random() < petV("otter")) { ot = Math.round(gain * 0.5); coins += ot; } }
    if (fish.event && newBest) coins += 500;
    let gn = 0; if (!fish.find) { if (shiny) gn += 1; if (newBest && fish.rarity === "Legendary") gn += 3; if (newBest && fish.event) gn += 2; } if (gn) gems += gn;
    let tk = 0; if (fish.event) { tk = ((shiny ? 3 : 1) + (newBest ? 5 : 0)) * (bf("evcharm") ? 2 : 1); tokens += tk; }
    addXp(gxp); if (!fish.find) questProgress(fish, weight, gain); else pageGot = onFind();
    if (fish.rarity === "Rare" || fish.rarity === "Legendary") SFX.rare(); else SFX.catch();
    splashAt(reelPos().x, reelPos().y, 16);
    save();
    state = RESULT;
    result = {ok: true, gain, title: fish.name, sub: fish.rarity, line: weight.toFixed(2) + " kg   +" + gain + " coins   +" + gxp + " xp"};
    pend = null;
    if (!fish.find) { result.unsold = true; result.line = weight.toFixed(2) + " kg   worth " + gain + " coins   +" + gxp + " xp"; result.perHr = Math.max(1, fish.value * weight * 0.08) * aqMul(); pend = result; }
    const bonus = [!fish.find && shiny ? "SHINY x3!" : "", !fish.find && fish.name === fotd().name ? "Fish of the Day x2!" : "", fish.event && newBest ? "First seasonal catch +500" : "", gn ? "+" + gn + " gem" + (gn > 1 ? "s" : "") : "", tk ? "+" + tk + " event tokens" : "", ot ? "Otter found +" + ot + " c" : "", mt].filter(Boolean).join("  ");

  }
}

function update(dt) {
